<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private-RAG</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}header{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#111827;color:#fff}header h1{font-size:19px;margin:0}header span,.muted{font-size:12px;color:#8490a3}main{max-width:1180px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:340px 1fr;gap:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 6px 18px #0f172a0a;margin-bottom:18px;overflow:hidden}.card h2{font-size:15px;margin:0;padding:17px 18px;border-bottom:1px solid #eef0f4}.body{padding:18px}label{display:block;font-size:12px;font-weight:700;color:#526078;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid #d7dce5;border-radius:9px;padding:10px 11px;background:#fff}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#eef2ff;color:#3730a3}.danger{background:#fee2e2;color:#991b1b}button:disabled{opacity:.5}.status{font-size:12px;color:#64748b;margin-top:10px}#documents{margin-top:12px;max-height:220px;overflow:auto}.doc{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eef0f4}.doc div{min-width:0;flex:1}.doc strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.doc small{color:#8892a4}.chat{height:calc(100vh - 112px);min-height:590px;display:flex;flex-direction:column}.chat-head{padding:14px 18px;border-bottom:1px solid #eef0f4;display:flex;align-items:center;gap:12px}.chat-head select{width:280px}#messages{flex:1;padding:22px;overflow:auto}.empty{text-align:center;color:#8490a3;margin-top:150px}.msg{max-width:82%;margin:0 0 18px}.msg.user{margin-left:auto}.bubble{padding:13px 15px;border-radius:13px;white-space:pre-wrap;line-height:1.65;font-size:14px}.user .bubble{background:#2563eb;color:#fff}.assistant .bubble{background:#f1f5f9}.refs{margin-top:8px;border-left:3px solid #93c5fd;padding-left:10px}.ref{font-size:12px;color:#526078;padding:5px 0}.ref strong{color:#1d4ed8}.inputbar{padding:15px 18px;border-top:1px solid #eef0f4;display:flex;gap:10px}.inputbar textarea{flex:1;resize:none;min-height:52px}.inputbar button{width:86px}.pill{display:inline-block;padding:2px 7px;border-radius:99px;background:#ecfdf5;color:#047857;font-size:11px;margin:3px}@media(max-width:820px){main{grid-template-columns:1fr}.chat{height:680px}}
</style></head><body>
<header><h1>Private-RAG</h1><span>FastAPI · LangGraph · Milvus · BM25</span></header><main><aside>
<section class="card"><h2>知识库</h2><div class="body"><select id="kb"><option value="">请选择知识库</option></select><label>新建知识库</label><input id="kb-name" placeholder="例如：公司制度库"><label>描述（可选）</label><input id="kb-desc" placeholder="知识库用途"><button class="secondary" style="width:100%;margin-top:10px" onclick="createKb()">创建知识库</button></div></section>
<section class="card"><h2>文档管理</h2><div class="body"><div class="muted">支持 PDF、Markdown 和 TXT，文档与检索结果按知识库隔离。</div><label>选择文档</label><input id="file" type="file" accept=".pdf,.md,.txt"><label>标签（逗号分隔）</label><input id="tags" placeholder="制度, 人事, 2026"><label>切片策略</label><select id="strategy"><option value="recursive">递归切片</option><option value="markdown">Markdown 标题</option><option value="semantic">语义切片</option></select><button class="primary" style="width:100%;margin-top:12px" onclick="upload()">上传并入库</button><div id="upload-status" class="status"></div><div id="documents"></div></div></section></aside>
<section class="card chat"><div class="chat-head"><select id="chat-kb"><option value="">请选择知识库后提问</option></select><span class="muted">回答仅基于私有文档并附来源</span></div><div id="messages"><div class="empty">上传文档后，可以询问制度、合同、论文或产品资料中的内容。</div></div><div class="inputbar"><textarea id="question" placeholder="输入问题，Enter 发送"></textarea><button id="send" class="primary" onclick="ask()">发送</button></div></section></main>
<script>
const api='', $=id=>document.getElementById(id);function esc(v=''){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}
function addMessage(role,text){const empty=document.querySelector('.empty');if(empty)empty.remove();const box=document.createElement('div');box.className='msg '+role;box.innerHTML=`<div class="bubble">${esc(text)}</div>`;$('messages').appendChild(box);$('messages').scrollTop=$('messages').scrollHeight;return box}
function renderRefs(box,refs=[]){if(!refs.length)return;box.insertAdjacentHTML('beforeend',`<div class="refs">${refs.map(r=>`<div class="ref"><strong>[${r.index}] ${esc(r.source_file||'未知来源')}</strong>${r.page?' · 第'+r.page+'页':''} · 匹配度 ${Math.round((r.score||0)*100)}%<br>${esc(r.text||'')}</div>`).join('')}</div>`)}
async function loadKbs(preferred=''){const res=await fetch(api+'/api/v1/knowledge-bases'),body=await res.json(),items=body.data||[],old=preferred||$('kb').value||$('chat-kb').value,options='<option value="">请选择知识库</option>'+items.map(k=>`<option value="${esc(k.id)}">${esc(k.name)} (${k.document_count} 个文档)</option>`).join('');$('kb').innerHTML=options;$('chat-kb').innerHTML=options;if(items.some(k=>k.id===old)){$('kb').value=old;$('chat-kb').value=old}await loadDocs()}
async function createKb(){const name=$('kb-name').value.trim();if(!name)return alert('请输入名称');const res=await fetch(api+'/api/v1/knowledge-bases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,description:$('kb-desc').value.trim()})}),body=await res.json();if(!res.ok)return alert(body.detail||'创建失败');$('kb-name').value='';$('kb-desc').value='';await loadKbs(body.data.id)}
async function upload(){const kb=$('kb').value,file=$('file').files[0];if(!kb)return alert('请先选择知识库');if(!file)return alert('请选择文档');const data=new FormData();data.append('file',file);data.append('knowledge_base_id',kb);data.append('tags',$('tags').value);data.append('strategy',$('strategy').value);$('upload-status').textContent='正在解析并建立索引…';const res=await fetch(api+'/api/v1/documents/upload',{method:'POST',body:data}),body=await res.json();$('upload-status').textContent=res.ok&&body.code===0?`完成：${body.data.chunk_count} 个片段`:(body.detail||body.message||'上传失败');if(res.ok){$('file').value='';await loadKbs(kb)}}
async function loadDocs(){const kb=$('kb').value;if(!kb){$('documents').innerHTML='';return}const res=await fetch(api+'/api/v1/documents/list?knowledge_base_id='+encodeURIComponent(kb)),body=await res.json();$('documents').innerHTML=(body.data||[]).map(d=>`<div class="doc"><div><strong>${esc(d.title)}</strong><small>${d.chunk_count} 个片段 ${(d.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</small></div><button class="danger" onclick="removeDoc('${esc(d.id)}')">删除</button></div>`).join('')||'<div class="status">暂无文档</div>'}
async function removeDoc(id){if(confirm('删除文档及对应向量？')){await fetch(api+'/api/v1/documents/'+encodeURIComponent(id),{method:'DELETE'});await loadKbs($('kb').value)}}
async function ask(){const kb=$('chat-kb').value,q=$('question').value.trim();if(!kb)return alert('请先选择知识库');if(!q)return;$('question').value='';addMessage('user',q);const box=addMessage('assistant',''),bubble=box.querySelector('.bubble');$('send').disabled=true;const sid=sessionStorage.privateRagSession||(sessionStorage.privateRagSession=crypto.randomUUID()),res=await fetch(api+'/api/v1/rag/ask-stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,knowledge_base_id:kb,session_id:sid})});if(!res.ok){bubble.textContent='请求失败：'+res.status;$('send').disabled=false;return}const reader=res.body.getReader(),decoder=new TextDecoder();let buffer='',answer='',done;while(true){const part=await reader.read();if(part.done)break;buffer+=decoder.decode(part.value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop();for(const raw of events){const event=(raw.match(/^event: (.+)$/m)||[])[1],line=(raw.match(/^data: (.+)$/m)||[])[1];if(!line)continue;const data=JSON.parse(line);if(event==='token'){answer+=data.token;bubble.textContent=answer}else if(event==='done')done=data}}if(done){bubble.textContent=done.answer||answer;renderRefs(box,done.references);if(done.cache_hit){const badge=document.createElement('small');badge.textContent='⚡ Redis 检索缓存命中';badge.style.cssText='display:block;margin-top:8px;color:#15803d';box.appendChild(badge)}}$('send').disabled=false}
$('kb').addEventListener('change',()=>{$('chat-kb').value=$('kb').value;loadDocs()});$('chat-kb').addEventListener('change',()=>{$('kb').value=$('chat-kb').value;loadDocs()});$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});loadKbs().catch(e=>alert('初始化失败：'+e.message));
</script></body></html>
